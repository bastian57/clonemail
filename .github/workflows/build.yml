name: CloneMail Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (manual cmdline-tools, NO setup-android (broken))
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.7 (AGP 8.5.2 butuh min Gradle 8.7)
        run: |
          set -e
          cd /tmp
          curl -sL -o gradle-8.7-bin.zip "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          unzip -q -o gradle-8.7-bin.zip
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.7/bin/gradle --version | head -n 5

      - name: Decode keystore (release signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ERROR: secret KEYSTORE_BASE64 KOSONG - isi dulu di repo Settings > Secrets and variables > Actions (4 secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_ALIAS_PASSWORD)"; exit 1; fi
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r\t ')
          echo "KEYSTORE_BASE64 panjang setelah dibersihkan: ${#CLEAN} karakter"
          printf '%s' "$CLEAN" | grep -q '[^A-Za-z0-9+/=]' && { echo "ERROR: KEYSTORE_BASE64 mengandung karakter bukan-base64 - harus murni base64 keystore"; exit 1; } || true
          printf '%s' "$CLEAN" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -lh "$GITHUB_WORKSPACE/release.keystore"
          file "$GITHUB_WORKSPACE/release.keystore" || true

      - name: Build release APK (log ke build.log)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          set -o pipefail
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "ERROR: secret KEYSTORE_PASSWORD KOSONG"; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "ERROR: secret KEY_ALIAS KOSONG"; exit 1; fi
          if [ -z "$KEY_ALIAS_PASSWORD" ] && [ -z "$KEY_PASSWORD" ]; then echo "ERROR: secret KEY_ALIAS_PASSWORD (atau KEY_PASSWORD) KOSONG"; exit 1; fi
          gradle assembleRelease 2>&1 | tee build.log
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk CloneMail-v1.1.0.apk
          ls -lh CloneMail-v1.1.0.apk build.log

      - name: Upload build.log artifact (selalu, walau build merah)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK ke rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "latest" --notes "Rolling latest build - CloneMail"
          gh release upload latest CloneMail-v1.1.0.apk --clobber
          gh release view build-log > /dev/null 2>&1 || gh release create build-log --title "build-log" --notes "Build logs - CloneMail"
          gh release upload build-log build.log --clobber
          echo "UPLOAD OK"
